<section class="bloque-contenido">
            <h2>Informe en PDF</h2>
            <p>Archivo: <strong>Lab 14 Calculo de la densidad del aceite.pdf</strong></p>
            <div class="botones-pdf">
                <button onclick="mostrarVisor()" id="btn-visor" class="btn-secundario">Ver PDF dentro de la página</button>
                <a href="Lab%2014%20Calculo%20de%20la%20densidad%20del%20aceite.pdf" download class="btn-primario">Descargar PDF</a>
            </div>
            <div id="contenedor-visor" class="visor-pdf-plegable">
                <iframe id="iframe-pdf" src=""></iframe>
            </div>
        </section>

        <script>
            function mostrarVisor() {
                var cont = document.getElementById('contenedor-visor');
                var frame = document.getElementById('iframe-pdf');
                var btn = document.getElementById('btn-visor');
                if (cont.style.display === 'block') {
                    cont.style.display = 'none';
                    frame.src = '';
                    btn.textContent = 'Ver PDF dentro de la página';
                } else {
                    frame.src = 'Lab%2014%20Calculo%20de%20la%20densidad%20del%20aceite.pdf';
                    cont.style.display = 'block';
                    btn.textContent = 'Ocultar visor PDF';
                }
            }
        </script>
